name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main
    with:
      system: http-server-protocol

  test-http2:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main
    with:
      system: http-server-backend-http2

  test-woo:
    name: Woo smoke (Ubuntu + libev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Install libev
        run: sudo apt-get update && sudo apt-get install -y libev4
      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: http-server-backend-woo
      - name: Woo smoke
        shell: bash
        run: ros -l scripts/ci/woo-smoke.lisp -q
